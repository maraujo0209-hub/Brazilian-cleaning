<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-title" content="Doctor's Appointment">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="apple-touch-icon.png">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doctor's Appointment | Admin</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    
    <style>
        :root { 
            --doc-navy: #1A3668; 
            --doc-green: #4D9345;
            --doc-red: #D9383A;
        }

        body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #f0f4f7; margin: 0; padding: 10px; }
        
        header { 
            text-align: center; 
            padding: 20px; 
            background: white; 
            border-radius: 15px; 
            margin-bottom: 15px; 
            border-bottom: 6px solid var(--doc-green);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .logo-img { height: 90px; margin-bottom: 10px; object-fit: contain; }
        .header-title { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }
        .text-navy { color: var(--doc-navy); }
        .text-green { color: var(--doc-green); }

        #calendar-card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        /* Calendar Buttons */
        .fc-toolbar-title { color: var(--doc-navy) !important; font-weight: 700; font-size: 1.1em !important; }
        .fc-button-primary { background-color: var(--doc-navy) !important; border: none !important; }
        .fc-button-primary:hover { background-color: var(--doc-green) !important; }

        /* Appointment Styling */
        .fc-event { 
            cursor: pointer; padding: 5px !important; border: none !important;
            background-color: var(--doc-navy) !important;
            border-left: 4px solid var(--doc-green) !important;
            margin-bottom: 3px !important;
        }

        .event-title-stack { color: white; line-height: 1.2; }
        .event-name { font-weight: bold; display: block; text-transform: uppercase; font-size: 0.85em; }
        .event-time { font-weight: normal; opacity: 0.9; font-size: 0.75em; }

        /* Modal / Form */
        #booking-modal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 400px; background: white; padding: 25px; z-index: 100;
            border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 90; backdrop-filter: blur(3px); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: var(--doc-navy); margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        
        .button-group { display: flex; gap: 10px; margin-top: 10px; }
        .save-btn { background: var(--doc-green); color: white; border: none; flex: 2; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .delete-btn { background: var(--doc-red); color: white; border: none; flex: 1; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; display: none; }
        .close-btn { background: transparent; color: #888; margin-top: 10px; border: none; width: 100%; padding: 10px; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <img src="apple-touch-icon.png" alt="Logo" class="logo-img">
        <h1 class="header-title">
            <span class="text-navy">DOCTOR'S</span> 
            <span class="text-green">APPOINTMENT</span>
        </h1>
    </header>

    <div id="calendar-card">
        <div id="calendar"></div>
    </div>

    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    
    <div id="booking-modal">
        <h3 id="selected-date-display" style="color:var(--doc-navy); margin:0 0 20px 0;">New Appointment</h3>
        <div class="form-group">
            <label>PATIENT NAME</label>
            <input type="text" id="patient-name" placeholder="Full name">
        </div>
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>START TIME</label>
                <select id="start-time"></select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>END TIME</label>
                <select id="end-time"></select>
            </div>
        </div>
        <div class="form-group">
            <label>NOTES / REASON</label>
            <textarea id="notes" rows="3" placeholder="Visit details..."></textarea>
        </div>
        <div class="button-group">
            <button id="modal-delete-btn" class="delete-btn" onclick="deleteAppointment()">DELETE</button>
            <button class="save-btn" onclick="saveAppointment()">CONFIRM APPOINTMENT</button>
        </div>
        <button class="close-btn" onclick="closeModal()">CANCEL</button>
    </div>

    <script>
        let calendar;
        let selectedDateStr;
        let editingEventId = null;
        const STORAGE_KEY = 'doc_appointment_system_v3'; 
        let appointments = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        // Self-Healing database tracking: assign IDs to legacy events instantly
        appointments = appointments.map(appt => {
            if (!appt.id) appt.id = 'appt-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5);
            return appt;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appointments));

        function populateTimes() {
            const startSelect = document.getElementById('start-time');
            const endSelect = document.getElementById('end-time');
            
            // Loop through hours from 7 AM to 7 PM (up to 8 PM end time options)
            for(let hour = 7; hour <= 19; hour++) {
                // Loop through 15-minute increments
                for(let min = 0; min < 60; min += 15) {
                    let displayHour = hour > 12 ? hour - 12 : hour;
                    let ampm = hour >= 12 ? 'PM' : 'AM';
                    let displayMin = min === 0 ? '00' : min;
                    
                    let displayStr = `${displayHour}:${displayMin} ${ampm}`;
                    
                    let padHour = hour < 10 ? `0${hour}` : `${hour}`;
                    let padMin = min === 0 ? '00' : min;
                    let valueStr = `${padHour}:${padMin}`;
                    
                    startSelect.add(new Option(displayStr, valueStr));
                    endSelect.add(new Option(displayStr, valueStr));
                }
            }
            // Add a final 8:00 PM closing block option to end options selection matrix
            endSelect.add(new Option("8:00 PM", "20:00"));
            
            // Set default end time to be the second option (15 minutes after start)
            endSelect.selectedIndex = 1;
        }
        populateTimes();

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
                height: 'auto',
                events: appointments,
                eventContent: function(arg) {
                    let stack = document.createElement('div');
                    stack.className = 'event-title-stack';
                    stack.innerHTML = `<span class="event-name">${arg.event.title}</span><span class="event-time">${arg.timeText}</span>`;
                    return { domNodes: [stack] };
                },
                dateClick: function(info) { openModal(info.dateStr); },
                eventClick: function(info) { openModal(null, info.event); }
            });
            calendar.render();
        });

        function openModal(date, event = null) {
            const deleteBtn = document.getElementById('modal-delete-btn');
            
            if (event) {
                // Editing an existing appt
                editingEventId = event.id || appointments.find(a => a.title === event.title && a.start === event.startStr)?.id;
                selectedDateStr = event.startStr.split('T')[0];
                
                document.getElementById('selected-date-display').innerText = "Edit Appointment";
                document.getElementById('patient-name').value = event.title;
                document.getElementById('notes').value = event.extendedProps.notes || "";
                
                if (event.startStr.includes('T')) {
                    document.getElementById('start-time').value = event.startStr.split('T')[1].substring(0, 5);
                }
                if (event.endStr && event.endStr.includes('T')) {
                    document.getElementById('end-time').value = event.endStr.split('T')[1].substring(0, 5);
                }
                
                deleteBtn.style.display = 'block'; 
            } else {
                // New fresh entry setup
                editingEventId = null;
                selectedDateStr = date;
                
                document.getElementById('selected-date-display').innerText = "Schedule: " + date;
                document.getElementById('patient-name').value = "";
                document.getElementById('notes').value = "";
                
                deleteBtn.style.display = 'none'; 
            }
            
            document.getElementById('booking-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function saveAppointment() {
            const name = document.getElementById('patient-name').value;
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;
            const notes = document.getElementById('notes').value;
            if(!name) { alert("Enter patient name"); return; }
            
            const startIso = `${selectedDateStr}T${startTime}:00`;
            const endIso = `${selectedDateStr}T${endTime}:00`;

            if (editingEventId) {
                // Update local storage data values
                appointments = appointments.map(appt => {
                    if (appt.id === editingEventId) {
                        return { ...appt, title: name, start: startIso, end: endIso, extendedProps: { notes: notes } };
                    }
                    return appt;
                });
                
                // Redraw UI indicators directly
                const calendarEvent = calendar.getEventById(editingEventId);
                if (calendarEvent) {
                    calendarEvent.setProp('title', name);
                    calendarEvent.setStart(startIso);
                    calendarEvent.setEnd(endIso);
                    calendarEvent.setExtendedProp('notes', notes);
                } else {
                    calendar.refetchEvents();
                }
            } else {
                const uniqueId = 'appt-' + Date.now();
                const newEvent = {
                    id: uniqueId,
                    title: name,
                    start: startIso,
                    end: endIso,
                    extendedProps: { notes: notes },
                    allDay: false
                };

                appointments.push(newEvent);
                calendar.addEvent(newEvent);
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(appointments));
            closeModal();
        }

        function deleteAppointment() {
            if (!editingEventId) return;
            
            if (confirm("Are you sure you want to permanently delete this appointment?")) {
                const targetMatch = appointments.find(appt => appt.id === editingEventId);

                // Filter out item from data framework
                appointments = appointments.filter(appt => appt.id !== editingEventId);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appointments));
                
                // Clear out of visual display
                let calendarEvent = calendar.getEventById(editingEventId);
                
                // Safety lookup matrix
                if (!calendarEvent && targetMatch) {
                    calendarEvent = calendar.getEvents().find(e => 
                        e.title === targetMatch.title && 
                        e.startStr === targetMatch.start
                    );
                }
                
                if (calendarEvent) {
                    calendarEvent.remove();
                }

                closeModal();
            }
        }

        function closeModal() {
            document.getElementById('booking-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
            editingEventId = null;
        }
    </script>
</body>
</html>
